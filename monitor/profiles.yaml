# Model Profiles 

# FEATURE_MONITOR_PROFILE picks one (default is gpt2_small)


gpt2_small:
  label: GPT-2 Small  # name shown in the dashboard 
  model_name: gpt2    # Hugging Face model id, loaded with TransformerLens's TransformerBridge.
  dtype: float32      # torch dtype for the model weights (SAEs stays float32 and casts its input)
  process_weights: true       # a set of tidy-ups TransformerLens can apply to the weights 
  sae_release: gpt2-small-res-jb    # the SAE to use 
  sae_id: blocks.8.hook_resid_pre    # The id of the SAE to use 
  layer: 8        # The layer that the SAE reads: block 8 in this project 
  neuronpedia_id: gpt2-small/8-res-jb   # used for finding feature label names for the features gotten by SAEs


# Layer 16 for Gemma is used because its output comes from 17 out of 26 blocks 
# which is roughly 65% and it is the closest match to GPT-2's input to
# block 8 (8 of 12, 67%), so the two profiles read at about the same relative depth.

gemma2_2b:
  label: Gemma 2 2B
  model_name: google/gemma-2-2b
  dtype: bfloat16
  process_weights: false
  sae_release: gemma-scope-2b-pt-res-canonical
  sae_id: layer_16/width_16k/canonical
  layer: 16 
  neuronpedia_id: gemma-2-2b/16-gemmascope-res-16k