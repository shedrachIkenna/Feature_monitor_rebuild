[project]
name = "feature-monitor-rebuild"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sae-lens>=6.54.0",
    "torch>=2.14.1",
    "transformer-lens>=3.9.0",
]

[tool.ruff]
line-length = 100 

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
markers = ["requires_model: loads the active profile's model and SAE, downloading them on first run"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
